<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Postales de Flores</title>
    <link rel="stylesheet" href="./src/index.css">
</head>
<body class="editorial-container">
    <header class="editorial-header">
        <div>
            <h1 class="editorial-header-title"> Florarium </h1>
            <p class="editorial-header-subtitle">Correspondencia por flores</p>
        </div>
    </header>

    <main class="postcard-grid">
        <!-- Rosa -->
        <div class="postcard-frame" onclick="window.location.href='./rosa.html'">
            <div class="stamp">FLOWER <br> POST</div>
            <div class="postcard-image-wrapper">
                <img src="https://i.pinimg.com/736x/e9/f9/0e/e9f90e67285564e9ef8e0489b98eefd5.jpg" alt="Rosales" class="postcard-image" referrerPolicy="no-referrer">
            </div>
            <h2 class="postcard-title">Rosa </h2>
            <p class="postcard-subtitle">Rosa común</p>
            <div class="postcard-footer">
                <button class="btn-vintage">Ver Detalles</button>
            </div>
        </div>

        <!-- Girasol -->
        <div class="postcard-frame" onclick="window.location.href='./girasol.html'">
            <div class="stamp">FLOWER<br>POST</div>
            <div class="postcard-image-wrapper">
                <img src="https://i.pinimg.com/1200x/16/12/ae/1612ae7f25d191deaa6cec16065359f9.jpg" alt="Girasoles" class="postcard-image" referrerPolicy="no-referrer">
            </div>
            <h2 class="postcard-title">Helianthus Annuus</h2>
            <p class="postcard-subtitle">Girasol</p>
            <div class="postcard-footer">
                <button class="btn-vintage">Ver Detalles</button>
            </div>
        </div>

        <!-- Tulipan -->
        <div class="postcard-frame" onclick="window.location.href='./tulipan.html'">
            <div class="stamp">FLOWER<br>POST</div>
            <div class="postcard-image-wrapper">
                <img src="https://i.pinimg.com/736x/f3/61/b4/f361b417f84eceb74312e69aeb984272.jpg" alt="Tulipanes" class="postcard-image" referrerPolicy="no-referrer">
            </div>
            <h2 class="postcard-title">Tulipa</h2>
            <p class="postcard-subtitle">Tulipanes</p>
            <div class="postcard-footer">
                <button class="btn-vintage">Ver Detalles</button>
            </div>
        </div>

        <!-- Lirio -->
        <div class="postcard-frame" onclick="window.location.href='./lirio.html'">
            <div class="stamp">FLOWER<br>POST</div>
            <div class="postcard-image-wrapper">
                <img src="https://i.pinimg.com/1200x/72/aa/ce/72aacec499285aa04f253d409a6eb8cb.jpg" alt="Lirios" class="postcard-image" referrerPolicy="no-referrer">
            </div>
            <h2 class="postcard-title">Lilium</h2>
            <p class="postcard-subtitle">Lilio/ Azucena</p>
            <div class="postcard-footer">
                <button class="btn-vintage">Ver Detalles</button>
            </div>
        </div>
    </main>

       <script type="module" src="./src/main.js"></script>
</body>
</html>
